[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-playthrough-ai"
version = "0.1.0"
description = "Explainable Pokémon playthrough team optimizer"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pokemon-ai = "pokemon_ai.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
